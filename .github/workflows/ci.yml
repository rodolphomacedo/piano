name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install stable

      # piano-audio depends on cpal, which links against ALSA on Linux via
      # alsa-sys's pkg-config build script. Not installed by default on the
      # runner image; without it, every command that touches the workspace
      # fails at the build step, before any lint or test even runs.
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Documentation builds without warnings
        run: cargo doc --workspace --no-deps

  no_std:
    name: piano-core builds without std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # The core crate is no_std so that real-time violations are unreachable
      # rather than merely discouraged. If this job breaks, something reached for
      # std on the audio path.
      - name: Build piano-core without default features
        run: cargo build -p piano-core --no-default-features

      - name: Build piano-params without default features
        run: cargo build -p piano-params --no-default-features

  wasm:
    name: piano-wasm builds for the browser
    runs-on: ubuntu-latest
    # The workspace-wide `RUSTFLAGS: -D warnings` above is a full override,
    # not an addition: Cargo lets exactly one RUSTFLAGS source win, and the
    # `RUSTFLAGS` env var always beats `target.<triple>.rustflags` from
    # .cargo/config.toml (verified locally; see docs/PERFORMANCE.md
    # PERF-011). Repeating `-D warnings` here alongside `+simd128` is what
    # makes both apply in this job, matching what a local build gets from
    # .cargo/config.toml alone.
    env:
      RUSTFLAGS: -D warnings -C target-feature=+simd128
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install the wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # This is the Rust-side half of milestone M3: catches anything that
      # would not compile for the browser (std misuse, a dependency with no
      # wasm32 support) before it silently bit-rots. Generating the
      # wasm-bindgen JS glue itself needs the matching `wasm-bindgen-cli`
      # binary and is a manual step — see README.md's "Try it in a browser".
      - name: Build piano-wasm for wasm32-unknown-unknown
        run: cargo build -p piano-wasm --release --target wasm32-unknown-unknown

  macos:
    name: Tests on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
