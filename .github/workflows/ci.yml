name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install stable

      # piano-audio depends on cpal, which links against ALSA on Linux via
      # alsa-sys's pkg-config build script. Not installed by default on the
      # runner image; without it, every command that touches the workspace
      # fails at the build step, before any lint or test even runs.
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Documentation builds without warnings
        run: cargo doc --workspace --no-deps

  no_std:
    name: piano-core builds without std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # The core crate is no_std so that real-time violations are unreachable
      # rather than merely discouraged. If this job breaks, something reached for
      # std on the audio path.
      - name: Build piano-core without default features
        run: cargo build -p piano-core --no-default-features

      - name: Build piano-params without default features
        run: cargo build -p piano-params --no-default-features

  macos:
    name: Tests on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
