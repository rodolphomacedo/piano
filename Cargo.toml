[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rodolphomacedo/piano"
authors = ["Rodolpho Macedo <rodolpho.ime@gmail.com>"]
keywords = ["audio", "dsp", "synthesis", "physical-modeling", "piano"]
categories = ["multimedia::audio", "simulation"]

[workspace.dependencies]
piano-core = { path = "crates/piano-core", version = "0.1.0", default-features = false }
piano-params = { path = "crates/piano-params", version = "0.1.0", default-features = false }
piano-render = { path = "crates/piano-render", version = "0.1.0" }
piano-audio = { path = "crates/piano-audio", version = "0.1.0" }
piano-midi = { path = "crates/piano-midi", version = "0.1.0" }
piano-wasm = { path = "crates/piano-wasm", version = "0.1.0" }
piano-studio = { path = "crates/piano-studio", version = "0.1.0" }
libm = "0.2"
hound = "3.5"
anyhow = "1"
thiserror = { version = "2", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = "0.5"
proptest = "1"
rustfft = "6"
cpal = "0.15"
rtrb = "0.4"
crossterm = "0.28"
midir = "0.11"
# Pinned exactly: the `wasm-bindgen` CLI used to generate JS glue must match
# this crate version precisely, or the build fails with a version-mismatch
# error. See the "Try it in a browser" section of README.md for the matching
# `cargo install` command.
wasm-bindgen = "=0.2.100"

# Lints are declared once here and inherited by every crate via
# `[lints] workspace = true`: a single place to tighten the quality gate, and
# no drift between crates.
[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A panic on the audio thread is an audible glitch at best and a dead stream at
# worst, so everything that can panic is denied.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
indexing_slicing = "warn"
todo = "warn"
float_cmp = "warn"
large_stack_arrays = "warn"
mutex_atomic = "warn"
# f32 <-> usize conversions are the daily bread of DSP, and Rust's `as` casts
# saturate rather than wrap or trap — exactly the panic-free behaviour the audio
# thread needs. Denying these three would mean drowning every hot loop in
# `allow` attributes, so they are turned off deliberately and once.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

# The release profile is what the audio thread actually runs; debug builds are
# far too slow for realtime playback, so dev builds still optimise dependencies.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true # keep symbols for profiling; stripped at packaging time

[profile.dev.package."*"]
opt-level = 2

[profile.bench]
inherits = "release"
