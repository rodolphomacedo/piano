[package]
name = "piano-core"
description = "Real-time-safe physical-modelling DSP primitives for synthesised piano strings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["std"]
# Without `std` the crate falls back to `libm` for transcendental functions, so
# it can target WASM and embedded hosts. `alloc` is always required: delay-line
# buffers are heap-allocated once, at construction, never while processing.
std = ["thiserror/std"]

[dependencies]
libm = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

# M7's benchmark harness (docs/PERFORMANCE.md, docs/ROADMAP.md). Each target
# isolates one component `PERF-005`/`PERF-007`/`PERF-008`/`PERF-009` flagged
# as "implemented, unmeasured" or "measured only in aggregate" so far.
[[bench]]
name = "components"
harness = false

[[bench]]
name = "delay_line"
harness = false

[[bench]]
name = "cache_order"
harness = false

[[bench]]
name = "simd_experiment"
harness = false

[lints]
workspace = true
